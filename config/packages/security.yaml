security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\AppCustomAuthenticator
            logout:
                path: app_logout
                target: app_login

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
        ROLE_SUPER_ADMIN: [ROLE_ADMIN, ROLE_USER]

    access_control:
        # Routes publiques
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }

        # Zone client
        - { path: ^/client, roles: [ROLE_USER, ROLE_ADMIN, ROLE_SUPER_ADMIN] }
        - { path: ^/panier, roles: [ROLE_USER, ROLE_ADMIN, ROLE_SUPER_ADMIN] }

        # Zone admin
        - { path: ^/admin, roles: [ROLE_ADMIN, ROLE_SUPER_ADMIN] }
        - { path: ^/dashboard, roles: [ROLE_ADMIN, ROLE_SUPER_ADMIN] }
        - { path: ^/produit, roles: [ROLE_ADMIN, ROLE_SUPER_ADMIN] }
        - { path: ^/commande, roles: [ROLE_ADMIN, ROLE_SUPER_ADMIN] }
        - { path: ^/gestion, roles: [ROLE_ADMIN, ROLE_SUPER_ADMIN] }
